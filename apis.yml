aid: aussie-broadband

name: Aussie Broadband

description: Aussie Broadband is an Australian telecommunications provider, founded in 2003 in regional Victoria, selling award-winning
  nbn and Opticomm internet, mobile SIM plans, hosted phone and network services to homes, businesses and enterprises. It also runs
  a wholesale division and Carbon, its self-service business and wholesale portal for qualification, ordering, billing, support and
  its on-net Aussie Fibre ethernet service. No public developer API or API documentation was found on its site.

